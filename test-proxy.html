<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>App Proxy Test</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 800px; margin: 50px auto; padding: 20px; }
        .test { margin: 20px 0; padding: 15px; border: 1px solid #ddd; border-radius: 5px; }
        .success { background: #d4edda; border-color: #c3e6cb; }
        .error { background: #f8d7da; border-color: #f5c6cb; }
        button { padding: 10px 20px; font-size: 16px; cursor: pointer; margin: 5px; }
        pre { background: #f5f5f5; padding: 10px; overflow-x: auto; }
    </style>
</head>
<body>
    <h1>🧪 App Proxy Connection Test</h1>
    <p>This page tests different URL patterns to find which one works with your Shopify App Proxy.</p>

    <div id="results"></div>

    <script>
        const PRODUCT_ID = '10028641550633'; // Efco Tuareg
        const tests = [
            {
                name: 'Direct Server (no proxy)',
                url: `https://products-7t0s.onrender.com/proxy/product/${PRODUCT_ID}`
            },
            {
                name: 'Direct Server (without /proxy)',
                url: `https://products-7t0s.onrender.com/product/${PRODUCT_ID}`
            },
            {
                name: 'Through Shopify Proxy (with /proxy)',
                url: `https://moversus.myshopify.com/apps/products/proxy/product/${PRODUCT_ID}`
            },
            {
                name: 'Through Shopify Proxy (without /proxy)',
                url: `https://moversus.myshopify.com/apps/products/product/${PRODUCT_ID}`
            }
        ];

        const resultsDiv = document.getElementById('results');

        async function runTest(test) {
            const div = document.createElement('div');
            div.className = 'test';
            div.innerHTML = `<h3>${test.name}</h3><p>Testing: <code>${test.url}</code></p><p>⏳ Loading...</p>`;
            resultsDiv.appendChild(div);

            try {
                const response = await fetch(test.url);
                const text = await response.text();
                
                if (response.ok) {
                    try {
                        const data = JSON.parse(text);
                        div.className = 'test success';
                        div.innerHTML = `
                            <h3>✅ ${test.name}</h3>
                            <p><strong>URL:</strong> <code>${test.url}</code></p>
                            <p><strong>Status:</strong> ${response.status} OK</p>
                            <p><strong>Product Title:</strong> ${data.title || 'N/A'}</p>
                            <details>
                                <summary>View Response</summary>
                                <pre>${JSON.stringify(data, null, 2).substring(0, 500)}...</pre>
                            </details>
                        `;
                    } catch (e) {
                        div.className = 'test error';
                        div.innerHTML = `
                            <h3>⚠️ ${test.name}</h3>
                            <p><strong>URL:</strong> <code>${test.url}</code></p>
                            <p><strong>Status:</strong> ${response.status} (but not JSON)</p>
                            <pre>${text.substring(0, 200)}</pre>
                        `;
                    }
                } else {
                    div.className = 'test error';
                    div.innerHTML = `
                        <h3>❌ ${test.name}</h3>
                        <p><strong>URL:</strong> <code>${test.url}</code></p>
                        <p><strong>Status:</strong> ${response.status} ${response.statusText}</p>
                        <pre>${text.substring(0, 200)}</pre>
                    `;
                }
            } catch (error) {
                div.className = 'test error';
                div.innerHTML = `
                    <h3>❌ ${test.name}</h3>
                    <p><strong>URL:</strong> <code>${test.url}</code></p>
                    <p><strong>Error:</strong> ${error.message}</p>
                `;
            }
        }

        async function runAllTests() {
            resultsDiv.innerHTML = '<p>Running tests...</p>';
            for (const test of tests) {
                await runTest(test);
                await new Promise(resolve => setTimeout(resolve, 500)); // Wait between tests
            }
        }

        // Run tests on page load
        runAllTests();
    </script>

    <hr>
    <h2>📋 Instructions</h2>
    <p>Look for the <strong>✅ green box</strong> above. That's the URL pattern that works!</p>
    <p>Then update your snippet to use that exact URL pattern.</p>
</body>
</html>
